<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IPTT 專利案件管理工作台</title><style>
:root{font-family:system-ui,-apple-system,'Noto Sans TC',sans-serif;color:#1b2c40;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}.shell{display:flex;min-height:100vh}aside{width:235px;background:#142a44;color:#e7eff8;padding:24px 14px;flex-shrink:0}.brand{font-size:18px;font-weight:750;margin:0 8px 8px}.sub{font-size:12px;color:#a7b9ce;margin:0 8px 25px}.nav{display:block;width:100%;text-align:left;background:transparent;border:0;color:#d7e3f0;padding:13px;border-radius:9px;cursor:pointer;font-size:14px;margin:3px 0}.nav:hover,.nav.active{background:#284762;color:white}.nav .count{float:right;color:#a8c6e4}main{flex:1;min-width:0;padding:28px;max-width:calc(100vw - 235px)}h1{font-size:24px;margin:0 0 8px}.muted{color:#6d7c8e;font-size:13px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap;margin-bottom:23px}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}button{cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}.btn{border:1px solid #d1dbe7;background:white;border-radius:8px;padding:10px 14px;color:#20364e;font-weight:650}.btn.primary{background:#215b9b;color:white;border-color:#215b9b}.btn.danger{color:#a13b3b}.panel{background:white;border:1px solid #e0e7ef;border-radius:13px;padding:19px;margin-bottom:17px;box-shadow:0 2px 10px #152a4010}.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:16px 0}.input,select,textarea{font:inherit;padding:9px 10px;border:1px solid #cbd7e3;border-radius:8px;background:white;max-width:100%}.input{min-width:240px}.tablebox{overflow:auto;max-height:62vh;border:1px solid #e0e7ef;border-radius:9px}table{border-collapse:collapse;width:max-content;min-width:100%;font-size:12px}th,td{padding:11px 12px;border-bottom:1px solid #edf1f6;text-align:left;max-width:260px;overflow-wrap:anywhere;vertical-align:top}th{background:#edf3fa;position:sticky;top:0;z-index:1;white-space:nowrap}tr:hover td{background:#f7faff}.rowbtn{border:0;background:transparent;color:#1e5b9c;text-decoration:underline}.status{padding:7px 10px;border-radius:7px;background:#e9f4eb;color:#24643c;font-size:12px}.status.err{background:#fff0ef;color:#a1302a}.status.loading{background:#edf3fb;color:#365c82}.stats{display:flex;gap:20px;flex-wrap:wrap}.stats strong{font-size:21px;display:block;margin-bottom:4px}.stats div{min-width:115px}.hidden{display:none!important}.overlay{position:fixed;inset:0;background:#1124388c;z-index:10;display:flex;align-items:center;justify-content:center;padding:20px}.modal{background:white;width:min(850px,100%);max-height:90vh;overflow:auto;border-radius:14px;padding:24px}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field label{display:block;font-size:12px;color:#596b7f;margin-bottom:6px}.field input,.field textarea{width:100%}.field textarea{min-height:80px}.modalfooter{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}.notice{padding:10px 13px;background:#fff7e8;border:1px solid #f2e1b7;border-radius:8px;color:#805c1c;font-size:13px;margin:12px 0}.small{font-size:12px}.check{width:17px;height:17px}.pill{font-size:11px;border:1px solid #dbe5ef;border-radius:50px;padding:4px 8px;color:#586d84}@media(max-width:780px){.shell{display:block}aside{width:100%;padding:12px;display:flex;overflow:auto;gap:6px;align-items:center}.brand{white-space:nowrap}.sub{display:none}.nav{white-space:nowrap;width:auto;padding:10px}main{max-width:100%;padding:16px}.fields{grid-template-columns:1fr}.input{min-width:160px}}
</style></head><body><div class="shell"><aside><div><div class="brand">IPTT 工作台</div><div class="sub">專利案件管理｜單一資料來源</div></div><div id="nav"></div></aside><main><div class="top"><div><h1 id="title">專利案件管理</h1><div class="muted" id="subtitle">Google Sheet 雙向同步</div></div><div class="actions"><span id="syncStatus" class="status loading">尚未同步</span><button id="syncBtn" class="btn primary">立即同步</button></div></div><section class="panel"><div class="stats"><div><strong id="total">—</strong><span class="muted">工作表案件筆數</span></div><div><strong id="shown">—</strong><span class="muted">目前顯示</span></div><div><strong id="selected">0</strong><span class="muted">已勾選</span></div><div><strong id="lastTime" style="font-size:15px">—</strong><span class="muted">最後同步時間</span></div></div></section><section class="panel"><div class="tools"><input id="search" class="input" placeholder="搜尋任意欄位、覽號或備註"><select id="filter"><option value="all">全部案件</option></select><button id="newBtn" class="btn">＋ 新增案件</button><span class="pill">每 60 秒同步</span></div><div id="batch" class="tools hidden"><span class="small">批次日期：</span><select id="batchField"></select><input id="batchDate" class="input" style="min-width:155px" type="date"><label class="small"><input type="checkbox" id="overwrite"> 允許覆蓋已有日期</label><button id="batchBtn" class="btn primary">更新勾選案件</button></div><div id="info" class="muted small" style="margin:10px 0"></div><div class="tablebox"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div><div class="tools"><button class="btn" id="prev">上一頁</button><span id="pageLabel" class="small"></span><button class="btn" id="next">下一頁</button></div></section><div class="muted small">資料僅取自目前綁定的 Google 試算表；新增與修改成功後才會顯示完成。每次同步將重新取得最新資料。</div></main></div><div id="overlay" class="overlay hidden"><div class="modal"><h2 id="modalTitle">新增案件</h2><div id="modalInfo" class="muted small"></div><div class="fields" id="fields"></div><div class="modalfooter"><button id="cancel" class="btn">取消</button><button id="save" class="btn primary">儲存至 Google Sheet</button></div></div></div><script>
const NAMES=['特殊案件','年費指示單案件','研管會減損清單','已到期案件減損','已解決'];const DATEFIELDS={'研管會減損清單':['程序三','簽報國科會備查日','國科會同意備查日','簽報審計部放棄備查日','審計部同意備查日'],'已到期案件減損':['處內辦理減損日','報請總務處減損日','總務處完成減損日']};const KEY={'研管會減損清單':'完整案件編號','已到期案件減損':'覽號','特殊案件':'Case Number','年費指示單案件':'Case Number'};
let pendingRefresh=false;let active=NAMES[0],dataset={headers:[],rows:[]},counts={},selected=new Map(),page=0,editing=null,busy=false,requestId=0;const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function call(name,...args){return new Promise((resolve,reject)=>{if(!window.google?.script?.run){reject(Error('請由 Google Apps Script 部署的網址開啟，勿直接雙擊 HTML 檔'));return;}google.script.run.withSuccessHandler(resolve).withFailureHandler(e=>reject(Error(e?.message||String(e))))[name](...args);});}
function status(s,type='loading'){$('syncStatus').textContent=s;$('syncStatus').className='status '+type;}
function nav(){ $('nav').innerHTML=NAMES.map(n=>`<button class="nav ${n===active?'active':''}" data-name="${esc(n)}">${esc(n)} <span class="count">${counts[n]??'—'}</span></button>`).join('');$('nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{active=b.dataset.name;selected.clear();page=0;$('search').value='';$('filter').value='all';nav();refresh();});}
async function refresh(){if(busy){pendingRefresh=true;return;}busy=true;const id=++requestId;status('正在同步…');$('syncBtn').disabled=true;try{const [d,c]=await Promise.all([call('ipttRead',active),call('ipttOverview')]);if(id!==requestId)return;dataset=d;counts=c;selected.clear();nav();$('title').textContent=active;$('subtitle').textContent='目前資料來源：Google Sheet／'+active;$('total').textContent=d.rows.length;$('lastTime').textContent=new Date().toLocaleTimeString('zh-TW',{hour12:false});setupFilter();setupBatch();render();status('同步成功','');}catch(e){status('同步失敗','err');$('info').textContent='錯誤：'+e.message;console.error(e);}finally{busy=false;$('syncBtn').disabled=false;if(pendingRefresh){pendingRefresh=false;refresh();}}}
function setupFilter(){const f=$('filter');const old=f.value;f.innerHTML='<option value="all">全部案件</option>';if(active==='研管會減損清單'){f.innerHTML+='<option value="done">已減損（審計部同意備查）</option><option value="pending">尚未完成減損</option><option value="nstc">國科會計畫</option>';}if(active==='已到期案件減損'){f.innerHTML+='<option value="todo">尚未辦理</option><option value="doing">辦理中</option><option value="done">已完成</option>';}if([...f.options].some(o=>o.value===old))f.value=old;}
function setupBatch(){const arr=DATEFIELDS[active];$('batch').classList.toggle('hidden',!arr);$('batchField').innerHTML=(arr||[]).map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');}
function fieldIndex(s){return dataset.headers.findIndex(h=>h.trim().replace(/\s+/g,' ')===s);}
function filtered(){const q=$('search').value.trim().toLowerCase(),f=$('filter').value;return dataset.rows.filter(r=>{if(q&&!r.values.some(x=>String(x).toLowerCase().includes(q)))return false;if(f==='all')return true;if(active==='研管會減損清單'){const done=!!r.values[fieldIndex('審計部同意備查日')];if(f==='done')return done;if(f==='pending')return !done;if(f==='nstc')return r.values[fieldIndex('是否為國科會計畫')]==='是';}if(active==='已到期案件減損'){const a=!!r.values[fieldIndex('處內辦理減損日')],b=!!r.values[fieldIndex('報請總務處減損日')],c=!!r.values[fieldIndex('總務處完成減損日')];return f==='todo'?!a&&!b&&!c:f==='doing'?!c&&(a||b):f==='done'?c:true;}return true;});}
function render(){const all=filtered(),size=50,pages=Math.max(1,Math.ceil(all.length/size));page=Math.min(page,pages-1);const rows=all.slice(page*size,(page+1)*size),h=dataset.headers;const visible=h.map((x,i)=>({x,i})).filter(o=>o.x&&o.x.trim());$('shown').textContent=all.length;$('selected').textContent=selected.size;$('pageLabel').textContent=`第 ${page+1} / ${pages} 頁（每頁 50 筆）`;$('prev').disabled=page===0;$('next').disabled=page>=pages-1;$('info').textContent='可左右捲動查看所有原始欄位。勾選僅用於批次日期更新；每次同步會清除勾選，避免操作過期資料。';$('thead').innerHTML=`<tr><th><input id="allCheck" class="check" type="checkbox" title="勾選目前頁面"></th><th>操作</th><th>Sheet 列號</th>${visible.map(o=>`<th>${esc(o.x)}</th>`).join('')}</tr>`;$('tbody').innerHTML=rows.map(r=>`<tr><td><input class="check rowcheck" type="checkbox" data-row="${r.row}" ${selected.has(r.row)?'checked':''}></td><td><button class="rowbtn edit" data-row="${r.row}">編輯</button></td><td>${r.row}</td>${visible.map(o=>`<td>${esc(r.values[o.i])}</td>`).join('')}</tr>`).join('')||`<tr><td colspan="${visible.length+3}" style="padding:25px;text-align:center">沒有符合條件的資料</td></tr>`;$('allCheck').onchange=e=>{rows.forEach(r=>e.target.checked?selected.set(r.row,r):selected.delete(r.row));render();};$('tbody').querySelectorAll('.rowcheck').forEach(el=>el.onchange=e=>{const r=rows.find(x=>x.row===Number(el.dataset.row));e.target.checked?selected.set(r.row,r):selected.delete(r.row);$('selected').textContent=selected.size;});$('tbody').querySelectorAll('.edit').forEach(el=>el.onclick=()=>openModal(rows.find(r=>r.row===Number(el.dataset.row))));}
function openModal(row){editing=row||null;$('modalTitle').textContent=row?'編輯案件（Sheet 第 '+row.row+' 列）':'新增案件';$('modalInfo').textContent='儲存後直接寫入 Google Sheet，並記錄異動。請勿任意修改案件識別欄位。';$('fields').innerHTML=dataset.headers.map((h,i)=>h&&h.trim()?`<div class="field"><label>${esc(h)}</label>${/備註|專利名稱|發明人/.test(h)?`<textarea data-col="${i}">${esc(row?.values[i]??'')}</textarea>`:`<input data-col="${i}" value="${esc(row?.values[i]??'')}">`}</div>`:'').join('');$('overlay').classList.remove('hidden');}
async function save(){const data={};$('fields').querySelectorAll('[data-col]').forEach(el=>{const k=dataset.headers[Number(el.dataset.col)];if(!editing||String(el.value)!==String(editing.values[Number(el.dataset.col)]??''))data[k]=el.value;});if(!Object.keys(data).length){$('overlay').classList.add('hidden');return;}if(!confirm('確定將此筆資料寫入 Google Sheet？'))return;$('save').disabled=true;try{await call('ipttSave',{sheet:active,mode:editing?'edit':'create',row:editing?.row,token:editing?.token,data});$('overlay').classList.add('hidden');await refresh();alert('儲存成功，已同步至 Google Sheet。');}catch(e){alert('儲存失敗：'+e.message);}finally{$('save').disabled=false;}}
async function batch(){if(!selected.size){alert('請先勾選案件');return;}const field=$('batchField').value,value=$('batchDate').value,overwrite=$('overwrite').checked;if(!value){alert('請選擇日期');return;}if(!confirm(`確定更新 ${selected.size} 筆案件的「${field}」為 ${value}？${overwrite?'\n注意：允許覆蓋原有日期。':''}`))return;$('batchBtn').disabled=true;try{const result=await call('ipttBatch',{sheet:active,field,value,overwrite,items:[...selected.values()].map(r=>({row:r.row,token:r.token}))});await refresh();alert('成功更新 '+result.changed+' 筆案件，已寫入 Google Sheet。');}catch(e){alert('批次更新失敗：'+e.message);}finally{$('batchBtn').disabled=false;}}
$('syncBtn').onclick=refresh;$('search').oninput=()=>{page=0;render();};$('filter').onchange=()=>{page=0;render();};$('prev').onclick=()=>{page--;render();};$('next').onclick=()=>{page++;render();};$('newBtn').onclick=()=>openModal();$('cancel').onclick=()=>$('overlay').classList.add('hidden');$('save').onclick=save;$('batchBtn').onclick=batch;nav();refresh();setInterval(()=>{if(!$('overlay').classList.contains('hidden')||document.hidden)return;refresh();},60000);
</script></body></html>
